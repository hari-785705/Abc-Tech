<html>
    <head>
        <title>ABC Tech</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>
            *{
                box-sizing: border-box;
            }
            html, body{
                max-width: 100%;
                overflow-x: hidden;
            }
            body{
                background-image: url('assets/img/home-bg.jpg');
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
            }
            img{
                max-width: 100%;
                height: auto;
            }
            a:link, a:visited {
                color:#0072ff;
                padding: 10px 10px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
            }
            a:hover{
                background-color:#00c6ff;
                border-radius: 40px;
            }
            .header{
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 14px 24px;
            }
            .search-box{
                position: relative;
                flex: 0 1 240px;
                min-width: 140px;
            }
            .search-box input[type="search"]{
                width: 100%;
                padding: 8px 36px 8px 14px;
                border-radius: 20px;
                border: 1px solid #ccc;
                outline: none;
            }
            .search-box input[type="search"]:focus{
                border-color: #00c6ff;
                box-shadow: 0 0 0 3px rgba(0,198,255,.15);
            }
            .search-box i{
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: #0072ff;
                pointer-events: none;
            }
            i{
                color: black;
            }
            h1{
                display: inline;
                font-style:italic;
                font-family:'Times New Roman', Times, serif;
                color: red;
                font-size: 40px;
            }
            h3{

                font-style: italic;
                font-family:'Times New Roman', Times, serif;
                color: deeppink;
                line-height: 0.4px;
                font-size: 30px;
            }
            .nav{
                flex: 1 1 100%;
                padding: 0;
            }
            ul{
                list-style-type: none;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                margin: 0;
                padding: 0;
                gap: 4px;
            }
            li{
                display: inline-flex;
                padding: 0;
                font-size: 15px;
            }

            .brand{
                display:flex;
                align-items:center;
                gap:14px;
                flex: 0 0 auto;
            }
            .brand-mark{
                width:60px;
                height:56px;
                clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
                flex-shrink:0;
                display:flex;
                align-items:center;
                justify-content:center;
                background:linear-gradient(135deg,#00c6ff,#0072ff,#7b2ff7);
                background-size:200% 200%;
                animation:brandGlow 6s ease infinite, brandPulse 3s ease-in-out infinite;
                color:#fff;
                font-family:'Arial Black', Arial, sans-serif;
                font-style:normal;
                font-weight:bold;
                letter-spacing:-1px;
                font-size:20px;
                box-shadow:0 4px 18px rgba(0,114,255,.5);
            }
            .brand-text{
                display:flex;
                flex-direction:column;
                justify-content:center;
            }
            .brand-name{
                display:block;
                font-style:italic;
                font-family:'Times New Roman', Times, serif;
                font-size:40px;
                font-weight:bold;
                letter-spacing:2px;
                margin:0;
                line-height:1;
                background:linear-gradient(90deg,#00c6ff,#0072ff,#7b2ff7,#00c6ff);
                background-size:300% auto;
                -webkit-background-clip:text;
                background-clip:text;
                -webkit-text-fill-color:transparent;
                animation:brandShine 5s linear infinite;
            }
            .brand-dot{
                color:#00c6ff;
                -webkit-text-fill-color:#00c6ff;
            }
            .brand-tag{
                display:block;
                margin:2px 0 0;
                font-style:italic;
                font-family:'Times New Roman', Times, serif;
                font-size:15px;
                letter-spacing:1px;
                color:#00c6ff;
                line-height:normal;
            }
            @keyframes brandShine{
                to{ background-position:300% center; }
            }
            @keyframes brandGlow{
                0%,100%{ background-position:0% 50%; }
                50%{ background-position:100% 50%; }
            }
            @keyframes brandPulse{
                0%,100%{ box-shadow:0 4px 18px rgba(0,114,255,.5); }
                50%{ box-shadow:0 4px 28px rgba(0,198,255,.8); }
            }

            @media (max-width: 640px){
                .header{
                    justify-content: center;
                    text-align: center;
                }
                .brand{
                    flex-direction: column;
                    text-align: center;
                }
                .brand-name{
                    font-size: 28px;
                }
                .brand-tag{
                    font-size: 12px;
                }
                .brand-mark{
                    width: 48px;
                    height: 44px;
                    font-size: 16px;
                }
                .search-box{
                    flex: 1 1 100%;
                }
                li{
                    font-size: 13px;
                }
                .content{
                    width: 92%;
                    margin: 24px auto;
                    padding: 22px;
                }
            }
        </style>
    </head>
    <body>
         <div class="header">
            <div class="brand">
                <div class="brand-mark">AT</div>
                <div class="brand-text">
                    <h1 class="brand-name">ABC Tech<span class="brand-dot">.</span></h1>
                    <h3 class="brand-tag">Powering&nbsp;Ideas&nbsp;Into&nbsp;Code</h3>
                </div>
            </div>
               <div class="search-box">
                <input type="search" placeholder="Type to search...">
                <i class="fa fa-search"></i>
            </div>
            <div class="nav">
            <ul>
                <li><a href="index.html"> HOME </a></li>
                <li><a href="about.html"> ABOUT </a></li>
                <li><a href="services.html"> SERVICES </a></li>
                <li><a href="contact.html"> CONTACT US </a></li>
                <li><a href="login.html"> LOGIN </a></li>
            </ul>
            </div>
    </body>
</html>
